# The Hub and keyboard classroom share one production deployment.
[build]
  command = "pnpm run build:site"
  publish = "dist"
  functions = "classroom-pilot/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["keyboard-notes.js"]

# Development deployments must not open games against the live database.
[context.deploy-preview.environment]
  CLASSROOM_ENABLED = "false"

[context.branch-deploy.environment]
  CLASSROOM_ENABLED = "false"
