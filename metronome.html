<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <link rel="stylesheet" href="./desktop-layout.css?v=4" />
  <title>Metronome</title>
  <link rel="icon" type="image/svg+xml" href="./tempo-icon.svg" />
  <link rel="apple-touch-icon" href="./tempo-icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./desktop-layout.js?v=2"></script>
  <link rel="stylesheet" href="./hub-ui.css?v=1.6" />
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="./hub-input.js?v=20260629"></script>
  <script src="./hub-audio.js?v=20261002-ready-before-play"></script>
  <script src="./hub-shell.js?v=20260717-worksheet-header-cards"></script>
  <script src="./hub-menu.js?v=20260712-profile-sharing"></script>
  <script src="./bravura-symbols.js"></script>
  <script src="./metronome-core.js?v=20261006-swing"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
<style>
@font-face { font-family:Bravura; src:url("./Bravura.otf") format("opentype"); }
.metro-patterns { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px; }
.metro-pattern { display:flex; align-items:center; justify-content:center; height:68px; border:1px solid #e7e5e4; border-radius:12px; background:#fafaf9; color:#111; }
.metro-pattern[aria-pressed=true] { background:#111; color:white; border-color:#111; }
body { margin:0; background:#fafaf9; color:#111; }
.metro-stage { width:860px; margin:0 auto; padding:12px 0 28px; text-align:center; }
.metro-display-row { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; margin-top:-60px; margin-bottom:24px; }
.metro-display-row .metro-display { margin:0; flex-shrink:0; }
.metro-display-row .metro-beats { width:100%; flex-wrap:nowrap; gap:10px; margin:0; }
.metro-display { display:flex; flex-direction:column; align-items:center; justify-content:center; width:360px; height:360px; margin:0 auto 24px; border:1px solid #e7e5e4; border-radius:50%; background:white; box-shadow:0 2px 6px #00000008; }
.metro-display .metro-tempo { margin:0; font-size:22px; }
.metro-display .metro-label { font-size:22px; }
.metro-label { font-size:20px; font-weight:800; letter-spacing:.12em; color:#78716c; text-transform:uppercase; }
.metro-bpm { display:block; width:320px; height:160px; margin:0 auto; padding:0; border:0; background:transparent; color:#111; font-size:128px; font-weight:900; line-height:1; text-align:center; font-variant-numeric:tabular-nums; }
.metro-bpm::-webkit-inner-spin-button { -webkit-appearance:none; }
.metro-tempo { margin:0 0 20px; color:#78716c; font-size:20px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.metro-slider { display:flex; align-items:center; gap:16px; }
.metro-slider .metro-button { width:48px; padding:0; flex-shrink:0; }
.metro-slider input { flex:1; appearance:none; -webkit-appearance:none; height:8px; touch-action:none; border:1px solid #a8a29e; border-radius:999px; cursor:grab; background:linear-gradient(to right,#111 0%,#111 var(--tempo-progress),#e7e5e4 var(--tempo-progress),#e7e5e4 100%); }
.metro-slider input:active { cursor:grabbing; }
.metro-slider input::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:24px; height:24px; border:0; border-radius:50%; background:#111; cursor:grab; transition:transform .12s ease; }
.metro-slider input:active::-webkit-slider-thumb { transform:scale(1.4); cursor:grabbing; }
.metro-slider input::-moz-range-thumb { width:24px; height:24px; border:0; border-radius:50%; background:#111; cursor:grab; transition:transform .12s ease; }
.metro-slider input:active::-moz-range-thumb { transform:scale(1.4); cursor:grabbing; }
.metro-button { display:inline-flex; height:44px; align-items:center; justify-content:center; gap:8px; padding:0 18px; border:1px solid #d6d3d1; border-radius:12px; background:white; color:black; font-size:14px; font-weight:800; }
.metro-button.primary { background:black; border-color:black; color:white; }
.metro-button:disabled { opacity:.4; cursor:default; }
.metro-button:focus-visible, input:focus-visible { outline:3px solid #2563eb; outline-offset:3px; }
.metro-beats { display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0 24px; min-height:60px; }
.metro-swing { flex-shrink:0; width:48px; height:60px; margin-right:6px; overflow:visible; }
.metro-dot { flex-shrink:0; display:flex; width:38px; height:38px; align-items:center; justify-content:center; border:1px solid #d6d3d1; border-radius:50%; background:#f5f5f4; color:#78716c; font-size:14px; font-weight:800; }
.metro-dot.active { background:#111; border-color:#111; color:white; }
.metro-dot.active.accent { background:#2563eb; border-color:#2563eb; }
.metro-actions { margin-top:24px; display:flex; justify-content:center; gap:18px; }
@keyframes metro-tap-bounce { 0%,100% { transform:scale(1); } 35% { transform:scale(.9); } 70% { transform:scale(1.05); } }
.metro-tap-bounce { animation:metro-tap-bounce 230ms ease-out; }
@media (prefers-reduced-motion:reduce) { .metro-tap-bounce { animation:none; } }
.metro-actions .metro-button { width:220px; height:76px; font-size:26px; border-radius:16px; }
.metro-setting { font-size:14px; font-weight:600; padding:6px 14px; }
.metro-beats-select { height:30px; min-width:64px; padding:0 8px; border:1px solid #d6d3d1; border-radius:8px; background:white; color:#111; font:inherit; cursor:pointer; }
.metro-error { margin-top:12px; color:#dc2626; font-size:14px; font-weight:700; }
</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const M=window.MetronomeCore;
function initial(){try{return M.settings({...JSON.parse(localStorage.getItem('mlh:metronome:v1')),bpm:120,accent:true});}catch{return {...M.defaults};}}
function Pattern({id}){
  const S=window.BRAVURA_SYMBOLS,count=M.subdivisions[id].offsets.length;
  const positions=Array.from({length:count},(_,i)=>(100-((count-1)*22+12))/2+i*22),beamed=id!=='beat';
  return <svg viewBox="0 0 100 64" width="100" height="64" aria-hidden="true">
    {positions.map((x,i)=><g key={i}><text x={x} y="49" fontFamily="Bravura" fontSize="36" fill="currentColor">{beamed?S.noteheadBlack:S.quarterNoteStemUp}</text>{beamed&&<line x1={x+10.5} x2={x+10.5} y1="48" y2="19" stroke="currentColor" strokeWidth="1.3"/>}</g>)}
    {beamed&&<line x1={positions[0]+10.5} x2={positions.at(-1)+10.5} y1="19" y2="19" stroke="currentColor" strokeWidth="4"/>}
    {id==='semiquavers'&&<line x1={positions[0]+10.5} x2={positions.at(-1)+10.5} y1="25" y2="25" stroke="currentColor" strokeWidth="4"/>}
    {(id==='dotted'||id==='snap')&&<><text x={(id==='dotted'?positions[0]:positions[1])+15} y="46" fontFamily="Bravura" fontSize="30" fill="currentColor">{S.augmentationDot}</text><line x1={id==='dotted'?positions[1]+2.5:positions[0]+10.5} x2={id==='dotted'?positions[1]+10.5:positions[0]+18.5} y1="25" y2="25" stroke="currentColor" strokeWidth="4"/></>}
    {id==='triplets'&&<text x="54" y="12" textAnchor="middle" fontFamily="Bravura" fontSize="24" fill="currentColor">{S.timeSig3}</text>}
  </svg>;
}
function App(){
  const [config,setConfig]=useState(initial),[running,setRunning]=useState(false),[loading,setLoading]=useState(false),[beat,setBeat]=useState(-1),[error,setError]=useState(''),[customiseOpen,setCustomiseOpen]=useState(false);
  const configRef=useRef(config),session=useRef(null),generation=useRef(0),taps=useRef([]),tapButton=useRef(null),pendulum=useRef(null),customiseRef=useRef(null);
  window.MLH.useClickOutside([customiseRef],[()=>setCustomiseOpen(false)]);
  function change(values){setConfig(current=>{const next=M.settings({...current,...values});configRef.current=next;return next;});}
  useEffect(()=>{try{localStorage.setItem('mlh:metronome:v1',JSON.stringify(config));}catch{}},[config]);
  function stop(){generation.current++;const active=session.current;session.current=null;if(active){clearInterval(active.interval);cancelAnimationFrame(active.frame);active.master.gain.value=0;active.ctx.close().catch(()=>{});}setRunning(false);setLoading(false);setBeat(-1);if(pendulum.current)pendulum.current.setAttribute("transform","rotate(0 24 46)");}
  async function start(){
    if(session.current||loading){stop();return;}
    const token=++generation.current;setLoading(true);setError('');
    let ctx;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio playback is not supported in this browser.');
      ctx=new AC();const master=ctx.createGain();master.connect(ctx.destination);
      const active={ctx,master,interval:null,frame:null,queue:[]};session.current=active;
      await ctx.resume();const ready=await window.MLH.prepareAudioPlayback(ctx,{metronome:true});
      if(token!==generation.current||session.current!==active)return;
      if(!ready)throw Error("Audio could not start. Please try again.");
      const origin=ctx.currentTime+.06;
      const transport=new M.Transport(origin,()=>configRef.current);
      const schedule=()=>{
        if(session.current!==active)return;
        master.gain.setValueAtTime(1,ctx.currentTime);
        for(const event of transport.take(ctx.currentTime)){
          const destination=ctx.createGain();destination.gain.value=1;destination.connect(master);
          window.MLH.playMetronomeClick(ctx,destination,event.time,event.accent);
          if(event.part===0)active.queue.push(event);
          setTimeout(()=>destination.disconnect(),Math.max(0,(event.time-ctx.currentTime+.3)*1000));
        }
      };
      const visual=()=>{
        if(session.current!==active)return;
        while(active.queue.length&&active.queue[0].time<=ctx.currentTime){
          const event=active.queue.shift();setBeat(event.beat);
          active.swing={...event,direction:active.swing?-active.swing.direction:-1};
        }
        if(active.swing&&pendulum.current){
          const phase=Math.min(1,Math.max(0,(ctx.currentTime-active.swing.time)/active.swing.duration));
          const angle=24*active.swing.direction*Math.cos(Math.PI*phase);
          pendulum.current.setAttribute("transform",`rotate(${angle} 24 46)`);
        }
        active.frame=requestAnimationFrame(visual);
      };
      setLoading(false);setRunning(true);schedule();active.interval=setInterval(schedule,25);visual();
    }catch(err){if(token!==generation.current)return;stop();setError(err.message||'The metronome could not start. Please try again.');if(ctx&&ctx.state!=='closed')ctx.close().catch(()=>{});}
  }
  function tap(){
    const button=tapButton.current;
    if(button){button.classList.remove('metro-tap-bounce');void button.offsetWidth;button.classList.add('metro-tap-bounce');}
    const now=performance.now();if(taps.current.length&&now-taps.current.at(-1)>2500)taps.current=[];taps.current=[...taps.current,now].slice(-7);const bpm=M.tapTempo(taps.current);if(bpm)change({bpm});}
  useEffect(()=>{const leave=()=>stop();window.addEventListener('pagehide',leave);return()=>{window.removeEventListener('pagehide',leave);stop();};},[]);
  useEffect(()=>{const key=event=>{if(event.repeat||event.target.closest('input,select,textarea,button,[contenteditable]'))return;if(event.code==='Space'){event.preventDefault();if(session.current)stop();else start();}if(event.key.toLowerCase()==='t'){event.preventDefault();tap();}};window.addEventListener('keydown',key);return()=>window.removeEventListener('keydown',key);},[loading]);
  return <div className={window.MLH.shell.pageShellClass}>
    <window.MLH.AppHeader icon="./tempo-icon.svg" title="Metronome" subtitle="Keep a steady beat with adjustable tempo, accents and subdivisions." profileUsesSharedSettings={false} profileShowLabel={false}/>
    <div className={window.MLH.shell.pageContentClass}><main className={`${window.MLH.shell.mainShellClass} metro-main`}>
      <window.MLH.AppToolbar left={<div className="hub-menu-anchor relative" ref={customiseRef}>
        <window.MLH.CustomiseButton icon={<img src="./customise.svg" alt="" className="h-[26px] w-[26px]"/>} onClick={()=>setCustomiseOpen(value=>!value)} dataMenuTrigger={true}/>
        {customiseOpen&&<window.MLH.MenuPanel title="Customise" position="left-0" variant="customise" dataMenuPanel={true}>
          <label className="metro-setting hub-toggle-row"><span>Beats Per Bar</span><select className="metro-beats-select" aria-label="Beats Per Bar" value={config.beats} onChange={event=>change({beats:event.target.value})}>{Array.from({length:12},(_,index)=><option key={index+1} value={index+1}>{index+1}</option>)}</select></label>
          <window.MLH.MenuToggleRow showGlyph={false} label="Stress First Beat" checked={config.accent} onChange={()=>change({accent:!config.accent})}/>
          <div style={{marginTop:16}}><p className="text-sm font-semibold text-stone-800">Subdivisions</p><div className="metro-patterns">{Object.entries(M.subdivisions).map(([id,pattern])=><button key={id} className="metro-pattern" title={pattern.label} aria-label={pattern.label} aria-pressed={config.subdivision===id} onClick={()=>change({subdivision:id})}><Pattern id={id}/></button>)}</div></div>
        </window.MLH.MenuPanel>}
      </div>}/>
      <div className="metro-stage">
        <div className="metro-display-row">
        <div className="metro-display">
        <p className="metro-label">{M.tempoLabel(config.bpm)}</p>
        <input id="metro-bpm" className="metro-bpm" type="number" min="30" max="240" value={config.bpm} onChange={event=>change({bpm:event.target.value})}/>
        <label className="metro-tempo" htmlFor="metro-bpm" style={{display:"block"}}>BPM</label>
        </div>
        <div className="metro-beats" aria-label={`${config.beats} beats per bar`}>
          <svg className="metro-swing" viewBox="0 0 48 60" aria-hidden="true">
            <path d="M15 8 H33 L43 55 H5 Z" fill="#111"/>
            <path d="M18 13 H30 L35 42 H13 Z" fill="#fafaf9"/>
            <g ref={pendulum}><path d="M24 46 V3" stroke="#111" strokeWidth="2.5" strokeLinecap="round"/><rect x="20" y="14" width="8" height="10" rx="2" fill="#111" stroke="#fafaf9" strokeWidth="1"/></g>
            <circle cx="24" cy="46" r="3" fill="#fafaf9"/><path d="M7 57 H41" stroke="#111" strokeWidth="3" strokeLinecap="round"/>
          </svg>
          {Array.from({length:config.beats},(_,index)=><span key={index} className={`metro-dot ${running&&beat===index?'active':''} ${config.accent&&index===0?'accent':''}`}>{index+1}</span>)}
        </div>
        </div>
        <div className="metro-slider"><button className="metro-button" aria-label="Decrease tempo" onClick={()=>change({bpm:config.bpm-1})}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="M5 12H19"/></svg></button><input type="range" style={{"--tempo-progress":`${(config.bpm-30)/210*100}%`}} aria-label="Tempo" min="30" max="240" value={config.bpm} onChange={event=>change({bpm:event.target.value})}/><button className="metro-button" aria-label="Increase tempo" onClick={()=>change({bpm:config.bpm+1})}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true"><path d="M5 12H19 M12 5V19"/></svg></button></div>
        <div className="metro-actions"><button ref={tapButton} className="metro-button" onClick={tap} onAnimationEnd={()=>tapButton.current?.classList.remove("metro-tap-bounce")}><img src="./tap.svg" alt="" aria-hidden="true" width="28" height="28"/>Tap BPM</button><button className="metro-button primary" onClick={()=>running||loading?stop():start()}>{loading?'Cancel':running?'Stop':'Start'}</button></div>
        {error&&<p role="alert" className="metro-error">{error}</p>}

      </div>
    </main></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><script src="./footer.js?v=20261005-update-history"></script></body></html>
