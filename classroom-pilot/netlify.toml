# Create a SEPARATE pilot site, with base directory classroom-pilot.
[build]
  command = "cd .. && corepack pnpm install --frozen-lockfile && node classroom-pilot/build.cjs"
  publish = "../dist/classroom-pilot"
  functions = "functions"
[functions]
  node_bundler = "esbuild"
  included_files = ["../keyboard-notes.js"]
