  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;
    const {

      SHARED_CONFIG,
      STAFF,
      BARS_PER_SYSTEM,
      KEY_SIGNATURE_SPACING,
      COLOUR,
      clefStepOffset,

      barPositions,

      LEGACY_NOTE_INDEX_OFFSET,
      noteByLetter,

      melodicAccidentalForLetter,
      cloneNotesForBar,
      transposeNotesForBar,
      finalRhythmForSignature,
      makeNote,
      levelMode,
      maxStepForLevel,
      stepRangeForLevel,
      noteAllowedForLevel,
      barCountForLevel,

      targetHasSourcePattern,
      targetHasAnySourcePattern,

      buildNotesFromPattern,
      buildFinalBar,
      buildCadenceBar,
      applyMelodicAccidentals,
      targetMovesWithinInterval,

      melodyNotes,
      dominantLetterForKey,
      levelMaximumInterval,

      makeEightBarRepetitionProgression,

      chordFitScore,
      fitChordsToMelody,

      makeCompletionQuestion,
      makeEightBarRepetitionQuestion
    } = window.MLH.MelodicDictation;

    const ASSET = {
      appIcon: "https://themusicliteracyhub.netlify.app/insert-missing-notes-icon.svg",
      level: "https://themusicliteracyhub.netlify.app/levels.svg",
      customise: "https://themusicliteracyhub.netlify.app/customise.svg",
      next: "https://themusicliteracyhub.netlify.app/next.svg",
      bronze: "https://themusicliteracyhub.netlify.app/bronze.svg",
      silver: "https://themusicliteracyhub.netlify.app/silver.svg",
      gold: "https://themusicliteracyhub.netlify.app/gold.svg",
      diamond: "https://themusicliteracyhub.netlify.app/diamond.svg",
      eye: "./eye.svg",
      metronome: "./metronome.svg",
      tempo: "./tempo.svg",
    };

    const LEVELS = {
      N3: { label: "National 3", description: "These questions are based on stepwise melodic repetition." },
      N4: { label: "National 4", description: "These questions are based on stepwise melodic sequences." },
      N5: { label: "National 5", description: "These questions are based on repetition and sequences." },
      H: { label: "Higher", description: "These questions are based on repetition, sequences, and melodic variations." },
      AH: { label: "Advanced Higher", description: "These questions are based on more challenging melodic variations." },
    };

    const SVG = { width: 920, height: 340 };

    const TEMPOS = [
      { id: "slow", label: "Adagio", bpm: 58 },
      { id: "medium", label: "Andante", bpm: 76 },
      { id: "fast", label: "Allegro", bpm: 96 },
    ];

    const patternHasRest = (pattern) => pattern.some(isRestRhythm);
    const barsHaveRest = (bars) => bars.some((bar) => bar.notes.some((note) => note.rest));

    const MIN_DISPLAY_STEP = -4;
    const MAX_DISPLAY_STEP = 12;

    const midiToFrequency = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

    const effectiveMidiForNote = (question, bar, note) => note.midi + keyAccidentalForLetter(question.key, note.letter) + (note.writtenAccidental ?? 0);
    const pitchForChordLetter = (question, bar, letter, preferredIndex = 4) => {
      const base = noteByLetter(letter, preferredIndex);
      const raised = chordAccidentalForLetter(question.key, bar.chordSymbol, letter);
      return base.midi + keyAccidentalForLetter(question.key, letter) + (raised ?? 0);
    };

    function noteInClefRange(note, clef) {
      const step = displayStep(note, clef);
      return step >= MIN_DISPLAY_STEP && step <= MAX_DISPLAY_STEP;
    }

    function fitNoteToClefRange(note, clef, key) {
      if (!note || note.rest || noteInClefRange(note, clef)) return note;
      let index = noteBaseIndex(note);
      if (index < 0) return note;
      let fitted = NOTE_POOL[index];
      let guard = 0;
      while (displayStep(fitted, clef) > MAX_DISPLAY_STEP && NOTE_POOL[index - 7] && guard < 4) {
        index -= 7;
        fitted = NOTE_POOL[index];
        guard += 1;
      }
      while (displayStep(fitted, clef) < MIN_DISPLAY_STEP && NOTE_POOL[index + 7] && guard < 8) {
        index += 7;
        fitted = NOTE_POOL[index];
        guard += 1;
      }
      if (!noteInClefRange(fitted, clef)) {
        const sameLetter = NOTE_POOL
          .filter((candidate) => candidate.letter === note.letter && noteInClefRange(candidate, clef))
          .sort((a, b) => Math.abs(displayStep(a, clef) - displayStep(note, clef)) - Math.abs(displayStep(b, clef) - displayStep(note, clef)));
        fitted = sameLetter[0] ?? fitted;
      }
      return { ...note, ...fitted, writtenAccidental: melodicAccidentalForLetter(key, fitted.letter) };
    }

    function fitBarsToClefRange(bars, clef, key) {
      bars.forEach((bar) => {
        bar.notes = bar.notes.map((note) => fitNoteToClefRange(note, clef, key));
      });
      return bars;
    }

    function shuffleItems(items) {
      const next = [...items];
      for (let index = next.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [next[index], next[swapIndex]] = [next[swapIndex], next[index]];
      }
      return next;
    }

    function avoidCorrectOptionFirst(options) {
      if (options[0]?.correct && options.length > 1) {
        const swapIndex = 1 + Math.floor(Math.random() * (options.length - 1));
        [options[0], options[swapIndex]] = [options[swapIndex], options[0]];
      }
      return options;
    }

    function cloneBarsForOption(bars, optionId) {
      const totalBars = bars.length;
      return bars.map((bar, barIndex) => ({
        ...bar,
        barIndex,
        totalBars,
        notes: bar.notes.map((note, noteIndex) => ({
          ...note,
          id: `${optionId}-${barIndex}-${noteIndex}`,
          barIndex,
          noteIndex,
        })),
      }));
    }

    function mutateNotePitch(note, key, direction = 0) {
      if (note?.rest) return note;
      const currentIndex = noteBaseIndex(note);
      const offsets = direction ? [direction] : shuffleItems([-1, 1]);
      for (const offset of offsets) {
        const base = NOTE_POOL[currentIndex + offset];
        if (!base) continue;
        return {
          ...note,
          ...base,
          writtenAccidental: melodicAccidentalForLetter(key, base.letter),
        };
      }
      return note;
    }

    function canUseForMelodyVariant(bars, bar, note, noteIndex) {
      if (!note) return false;
      const isFirstNote = bar.barIndex === 0 && noteIndex === 0;
      const isFinalNote = bar.barIndex === bars.length - 1 && noteIndex === bar.notes.length - 1;
      return !note.rest && !note.tieToNext && !note.tiedFromPrevious && !isFirstNote && !isFinalNote;
    }

    function makeMelodyVariantCell(bars, candidates) {
      const cells = [];
      candidates.forEach(({ bar, noteIndex }) => {
        const cell = [{ bar, noteIndex }];
        let nextIndex = noteIndex + 1;
        while (cell.length < 3 && canUseForMelodyVariant(bars, bar, bar.notes[nextIndex], nextIndex)) {
          cell.push({ bar, noteIndex: nextIndex });
          nextIndex += 1;
        }
        if (cell.length >= 2) cells.push(cell);
      });
      return randomItem(cells) ?? null;
    }

    function reshapeMelodyVariantCell(cell, key) {
      if (!cell || cell.length < 2) return false;
      const first = cell[0].bar.notes[cell[0].noteIndex];
      const firstIndex = noteBaseIndex(first);
      if (firstIndex < 0) return false;
      const second = cell[1].bar.notes[cell[1].noteIndex];
      const originalDirection = Math.sign(noteBaseIndex(second) - firstIndex);
      const possibleDirections = [-1, 1].filter((direction) => {
        const endIndex = firstIndex + direction * (cell.length - 1);
        return endIndex >= 0 && endIndex < NOTE_POOL.length;
      });
      const oppositeDirection = originalDirection ? -originalDirection : 0;
      const direction = oppositeDirection && possibleDirections.includes(oppositeDirection) && Math.random() < 0.72
        ? oppositeDirection
        : randomItem(possibleDirections.length ? possibleDirections : [-1, 1]);
      let previousIndex = firstIndex;
      let changed = false;

      cell.slice(1).forEach(({ bar, noteIndex }, index) => {
        const current = bar.notes[noteIndex];
        const currentIndex = noteBaseIndex(current);
        const stepSize = index === 0 && Math.random() < 0.68 ? 2 : 1;
        const targetIndex = clamp(previousIndex + direction * stepSize, 0, NOTE_POOL.length - 1);
        const base = NOTE_POOL[targetIndex];
        if (!base) return;
        if (targetIndex !== currentIndex) changed = true;
        bar.notes[noteIndex] = {
          ...current,
          ...base,
          writtenAccidental: melodicAccidentalForLetter(key, base.letter),
        };
        previousIndex = targetIndex;
      });

      return changed;
    }

    function transposeMelodyVariantCell(cell, key) {
      if (!cell || cell.length < 2) return false;
      const intervals = [-2, -2, -2, 2, 2, -3, 3, -4, 4];
      const interval = randomItem(intervals);
      const replacements = [];

      for (const { bar, noteIndex } of cell) {
        const current = bar.notes[noteIndex];
        const currentIndex = noteBaseIndex(current);
        const targetIndex = currentIndex + interval;
        if (currentIndex < 0 || targetIndex < 0 || targetIndex >= NOTE_POOL.length) return false;
        replacements.push({ bar, noteIndex, current, base: NOTE_POOL[targetIndex] });
      }

      replacements.forEach(({ bar, noteIndex, current, base }) => {
        bar.notes[noteIndex] = {
          ...current,
          ...base,
          writtenAccidental: melodicAccidentalForLetter(key, base.letter),
        };
      });

      return true;
    }

    function makeMelodyVariantBars(correctBars, key, variantId) {
      const bars = cloneBarsForOption(correctBars, variantId);
      const candidates = [];
      bars.forEach((bar) => {
        bar.notes.forEach((note, noteIndex) => {
          if (canUseForMelodyVariant(bars, bar, note, noteIndex)) candidates.push({ bar, noteIndex });
        });
      });

      const used = new Set();
      const variantCell = Math.random() < 0.9 ? makeMelodyVariantCell(bars, candidates) : null;
      if (variantCell) {
        const transposed = Math.random() < 0.62 && transposeMelodyVariantCell(variantCell, key);
        const reshaped = !transposed && Math.random() < 0.82 && reshapeMelodyVariantCell(variantCell, key);
        if (!transposed && !reshaped) {
          const direction = randomItem([-1, 1]);
          variantCell.forEach(({ bar, noteIndex }) => {
            bar.notes[noteIndex] = mutateNotePitch(bar.notes[noteIndex], key, direction);
          });
        }
        variantCell.forEach(({ bar, noteIndex }) => used.add(`${bar.barIndex}:${noteIndex}`));
      }

      const targetChanges = Math.min(candidates.length, Math.random() < 0.5 ? 3 : 4);
      shuffleItems(candidates)
        .filter(({ bar, noteIndex }) => !used.has(`${bar.barIndex}:${noteIndex}`))
        .slice(0, Math.max(0, targetChanges - used.size))
        .forEach(({ bar, noteIndex }, index) => {
          const direction = index % 2 === 0 ? randomItem([-1, 1]) : 0;
          bar.notes[noteIndex] = mutateNotePitch(bar.notes[noteIndex], key, direction);
        });

      return bars;
    }

    function balanceRestOptions(options, key) {
      const restOptionCount = options.filter((option) => barsHaveRest(option.bars)).length;
      if (restOptionCount !== 1) return options;

      const source = options.find((option) => barsHaveRest(option.bars));
      const targetIndex = options.findIndex((option) => !option.correct && !barsHaveRest(option.bars));
      if (!source || targetIndex < 0) return options;

      const balancedBars = makeMelodyVariantBars(source.bars, key, `${options[targetIndex].id}-rest-balanced`);
      options[targetIndex] = { ...options[targetIndex], bars: balancedBars };
      return options;
    }

    function canTieAcrossBeat(first, second, timeSignature) {
      if (first?.rhythm !== "quaver") return false;
      if (!["crotchet", "minim", "dottedCrotchet"].includes(second?.rhythm)) return false;
      const beatUnit = timeSignature?.id === "6/8" ? 1.5 : 1;
      const tiePoint = first.beat + first.beats;
      const startsNextExactly = Math.abs(second.beat - tiePoint) < 0.001;
      const crossesBeatGroup = Math.abs(tiePoint / beatUnit - Math.round(tiePoint / beatUnit)) < 0.001;
      return startsNextExactly && crossesBeatGroup;
    }

    function addTieToAhBars(bars, key, timeSignature) {
      const candidates = [];
      bars.forEach((bar) => {
        bar.notes.forEach((note, noteIndex) => {
          const next = bar.notes[noteIndex + 1];
          if (note?.rest || next?.rest || !next) return;
          if (!canTieAcrossBeat(note, next, timeSignature)) return;
          candidates.push({ bar, noteIndex });
        });
      });
      if (!candidates.length) return bars;
      const { bar, noteIndex } = randomItem(candidates);
      const first = bar.notes[noteIndex];
      const second = bar.notes[noteIndex + 1];
      bar.notes[noteIndex] = { ...first, tieToNext: true };
      bar.notes[noteIndex + 1] = {
        ...second,
        ...NOTE_POOL[noteBaseIndex(first)],
        writtenAccidental: melodicAccidentalForLetter(key, first.letter),
        tiedFromPrevious: true,
      };
      return bars;
    }

    function barsSignature(bars) {
      return bars.map((bar) => bar.notes.map((note) => `${note.rest ? "R" : note.step}:${note.rhythm}:${note.tieToNext ? "tie" : ""}`).join(",")).join("|");
    }

    function makeIdentifyMelodyQuestion(level = "AH") {
      const useShortExtract = Math.random() < 0.28;
      const base = makeCompletionQuestion(level, 0, useShortExtract);
      const clef = Math.random() < 0.28 ? "bass" : "treble";
      const sourceBars = useShortExtract ? base.bars.slice(0, 2) : base.bars;
      const correctBars = cloneBarsForOption(sourceBars, "correct");
      if (Math.random() < 0.28) addTieToAhBars(correctBars, base.key, base.timeSignature);
      if (clef === "bass") {
        correctBars.forEach((bar) => {
          bar.notes = bar.notes.map((note) => {
            if (note.rest) return note;
            const lower = NOTE_POOL[clamp(noteBaseIndex(note) - 7, 0, NOTE_POOL.length - 1)];
            return { ...note, ...lower, writtenAccidental: melodicAccidentalForLetter(base.key, lower.letter) };
          });
        });
      }
      fitBarsToClefRange(correctBars, clef, base.key);
      const options = [{ id: "correct", bars: correctBars, correct: true }];
      const seen = new Set([barsSignature(correctBars)]);

      let attempts = 0;
      while (options.length < 3 && attempts < 40) {
        attempts += 1;
        const variantBars = makeMelodyVariantBars(correctBars, base.key, `variant-${options.length}-${attempts}`);
        fitBarsToClefRange(variantBars, clef, base.key);
        const signature = barsSignature(variantBars);
        if (seen.has(signature)) continue;
        seen.add(signature);
        options.push({ id: `variant-${options.length}`, bars: variantBars, correct: false });
      }

      while (options.length < 3) {
        const fallbackBars = makeMelodyVariantBars(correctBars, base.key, `fallback-${options.length}`);
        options.push({ id: `variant-${options.length}`, bars: fallbackBars, correct: false });
      }

      balanceRestOptions(options, base.key);
      const shuffledOptions = avoidCorrectOptionFirst(shuffleItems(options));
      return {
        ...base,
        questionType: "identifyMelody",
        clef,
        targetBar: null,
        bars: correctBars,
        options: shuffledOptions,
        selectedOptionIndex: null,
        answerIndex: shuffledOptions.findIndex((option) => option.correct),
        prompt: "Listen to the music and select the melody that matches what you hear.",
      };
    }

    function makeQuestion(level = "N5", attempt = 0) {
      if (level === "AH") return makeIdentifyMelodyQuestion(level);
      if ((level === "N3" || level === "N4" || level === "N5") && Math.random() < 0.5) {
        return makeEightBarRepetitionQuestion(level);
      }
      return makeCompletionQuestion(level, attempt);
    }

    function RhythmGuide({ bar, positions, top, activeNoteId, timeSignature, clef = "treble" }) {
      const guideTop = top - 48;
      const guideNotes = bar.notes.map((note) => ({ ...note, step: 5, writtenAccidental: null }));
      return <g opacity="0.72"><BarNotes bar={{ ...bar, notes: guideNotes }} notes={guideNotes} positions={positions} top={guideTop} colour={COLOUR.guide} activeNoteId={activeNoteId} forceStemUp timeSignature={timeSignature} clef={clef} /></g>;
    }

    function CorrectionLayer({ bar, userNotes, positions, top, timeSignature, clef = "treble" }) {
      const correctionNotes = bar.notes.map((note, index) => userNotes[index]?.step === note.step ? null : { ...note, id: `correct-${index}` });
      const shiftedPositions = positions.map((x) => x + 20);
      return <BarNotes bar={bar} notes={correctionNotes} positions={shiftedPositions} top={top} colour={COLOUR.green} timeSignature={timeSignature} clef={clef} />;
    }

    function MelodyOptionNotation({ option, question, colour = "currentColor" }) {
      const top = STAFF.topA;
      const optionQuestion = { ...question, bars: option.bars };
      const finalBar = option.bars.length - 1;
      const displayBarCount = option.bars.length === 2 ? 2 : BARS_PER_SYSTEM;
      return (
        <svg viewBox="0 0 920 130" className="h-auto w-full overflow-visible" aria-hidden="true">
          <rect width="920" height="130" fill="transparent" />
          <g transform="translate(0 -36)" color={colour}>
            <Staff top={top} systemIndex={0} question={optionQuestion} displayBarCount={displayBarCount} colour={colour} />
            {option.bars.map((bar) => {
              const start = barStart(bar.barIndex, displayBarCount);
              const end = start + barWidth(bar.barIndex, displayBarCount);
              const positions = barPositions(bar, displayBarCount);
              return (
                <g key={bar.barIndex}>
                  <text x={bar.barIndex === 0 ? start - 15 : start + 5} y={top - 17} fill={colour} fontSize="12" fontWeight="700">{bar.barIndex + 1}</text>
                  <BarNotes bar={bar} notes={bar.notes} positions={positions} top={top} colour={colour} timeSignature={question.timeSignature} clef={question.clef} />
                  {bar.barIndex === finalBar ? (
                    <g>
                      <line x1={end - 5} x2={end - 5} y1={top - 0.5} y2={top + STAFF.gap * 4 + 0.5} stroke={colour} strokeWidth="1.4" />
                      <line x1={end} x2={end} y1={top - 0.5} y2={top + STAFF.gap * 4 + 0.5} stroke={colour} strokeWidth="4" />
                    </g>
                  ) : (
                    <line x1={end} x2={end} y1={top} y2={top + STAFF.gap * 4} stroke={colour} strokeWidth="1.35" />
                  )}
                </g>
              );
            })}
          </g>
        </svg>
      );
    }

    function IdentifyMelodyScore({ question, feedback, onSelectOption }) {
      return (
        <div className="w-full space-y-2 md:mx-3">
          {question.options.map((option, index) => {
            const selected = question.selectedOptionIndex === index;
            const isCorrect = index === question.answerIndex;
            const showCorrect = feedback && isCorrect;
            const showWrong = feedback && selected && !isCorrect;
            const lineColour = showCorrect ? COLOUR.green : showWrong ? COLOUR.red : "currentColor";
            const stateClass = showCorrect ? "border-green-500 bg-green-50" : showWrong ? "border-red-500 bg-red-50" : selected ? "border-stone-950 bg-stone-50" : "border-stone-200 bg-white hover:bg-stone-50";
            return (
              <button
                type="button"
                key={option.id}
                aria-disabled={Boolean(feedback)}
                data-feedback-continue={feedback ? "true" : undefined}
                onClick={(event) => {
                  if (feedback) return;
                  onSelectOption(index);
                }}
                className={`relative flex w-full items-center rounded-xl border px-3 py-1.5 text-left shadow-sm ${stateClass}`}
              >
                <span className="min-w-0 flex-1 text-stone-950">
                  <MelodyOptionNotation option={option} question={question} colour={lineColour} />
                </span>
                <span className={`ml-3 mr-[25px] flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border text-lg font-black ${showCorrect ? "border-green-600 bg-green-600 text-white" : showWrong ? "border-red-600 bg-red-600 text-white" : selected ? "border-stone-950 bg-stone-950 text-white" : "border-black/20 bg-white text-transparent"}`}>
                  ✓
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    function Score(props) {
      if (props.question.questionType === "identifyMelody") {
        return <IdentifyMelodyScore question={props.question} feedback={props.feedback} onSelectOption={props.onSelectOption} />;
      }
      return <MissingNotesScore {...props} />;
    }

    function MissingNotesScore({ question, userNotes, setUserNotes, feedback, activeNoteId, hoverNote, setHoverNote }) {
      const [draggingNote, setDraggingNote] = useState(null);
      const targetInputRef = useRef(null);
      const isOneSystem = question.bars.length <= BARS_PER_SYSTEM;
      const systems = isOneSystem ? [STAFF.topA] : [STAFF.topA, STAFF.topB];
      const scoreHeight = isOneSystem ? 154 : SVG.height;
      const scoreOffsetY = isOneSystem ? -30 : 0;

      useEffect(() => {
        const element = targetInputRef.current;
        if (!element) return;
        const blockScroll = (event) => {
          event.preventDefault();
          event.stopPropagation();
        };
        element.addEventListener("touchstart", blockScroll, { passive: false });
        element.addEventListener("touchmove", blockScroll, { passive: false });
        return () => {
          element.removeEventListener("touchstart", blockScroll);
          element.removeEventListener("touchmove", blockScroll);
        };
      }, [question.id, question.targetBar]);

      function pointerToSvg(event) {
        const matrix = event.currentTarget.getScreenCTM?.();
        if (matrix) {
          const point = event.currentTarget.ownerSVGElement.createSVGPoint();
          point.x = event.clientX;
          point.y = event.clientY;
          const local = point.matrixTransform(matrix.inverse());
          return { x: local.x, y: local.y };
        }
        const svg = event.currentTarget.ownerSVGElement ?? event.currentTarget;
        const rect = svg.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) / rect.width) * SVG.width,
          y: ((event.clientY - rect.top) / rect.height) * SVG.height,
        };
      }

      function noteFromPointer(event, lockedIndex = null) {
        const targetBar = question.bars[question.targetBar];
        if (!targetBar) return null;
        const pointer = pointerToSvg(event);
        const top = systemTop(targetBar.barIndex);
        const positions = barPositions(targetBar);
        const noteIndex = lockedIndex ?? positions.reduce((best, x, index) => Math.abs(pointer.x - x) < Math.abs(pointer.x - positions[best]) ? index : best, 0);
        const targetNote = targetBar.notes[noteIndex];
        if (!targetNote) return null;
        const touchOffset = event.pointerType === "touch" ? 42 : 0;
        const effectiveY = pointer.y - touchOffset;
        if (lockedIndex === null && (Math.abs(pointer.x - positions[noteIndex]) > 48 || pointer.y < top - 28 || pointer.y > top + 92)) return null;
        const step = clamp(Math.round((top + STAFF.gap * 4 - effectiveY) / (STAFF.gap / 2)), NOTE_POOL[0].step, NOTE_POOL.at(-1).step);
        const base = NOTE_POOL.find((note) => note.step === step) ?? NOTE_POOL[0];
        const writtenAccidental = melodicAccidentalForLetter(question.key, base.letter);
        return { ...base, id: `user-${noteIndex}`, rhythm: targetNote.rhythm, beats: targetNote.beats, barIndex: targetBar.barIndex, noteIndex, writtenAccidental };
      }

      function handleMove(event) {
        if (feedback) return;
        if (draggingNote) {
          event.preventDefault();
          const nextNote = noteFromPointer(event, draggingNote.noteIndex);
          if (nextNote) {
            setDraggingNote(nextNote);
            setHoverNote(nextNote);
          }
          return;
        }
        setHoverNote(noteFromPointer(event));
      }

      function handlePointerDown(event) {
        if (feedback) return;
        const nextNote = noteFromPointer(event);
        if (!nextNote) return;
        event.preventDefault();
        event.currentTarget.setPointerCapture?.(event.pointerId);
        setDraggingNote(nextNote);
        setHoverNote(nextNote);
      }

      function handlePointerUp(event) {
        if (feedback || !draggingNote) return;
        event.preventDefault();
        event.currentTarget.releasePointerCapture?.(event.pointerId);
        setUserNotes((current) => ({ ...current, [draggingNote.noteIndex]: draggingNote }));
        setHoverNote(null);
        setDraggingNote(null);
      }

      return (
        <svg viewBox={`0 0 ${SVG.width} ${scoreHeight}`} className="h-auto w-full select-none overflow-visible">
          <rect width={SVG.width} height={scoreHeight} fill="white" />
          <g transform={scoreOffsetY ? `translate(0 ${scoreOffsetY})` : undefined}>
          {systems.map((top, systemIndex) => <Staff key={systemIndex} top={top} systemIndex={systemIndex} question={question} />)}
          {question.bars.map((bar) => {
            const top = systemTop(bar.barIndex);
            const start = barStart(bar.barIndex);
            const end = start + barWidth(bar.barIndex);
            const positions = barPositions(bar);
            const isTarget = bar.barIndex === question.targetBar;
            const targetUserNotes = bar.notes.map((_, index) => userNotes[index] ?? null);
            return (
              <g key={bar.barIndex}>
                <text x={(bar.barIndex === 0 || bar.barIndex === 4) ? start - 15 : start + 5} y={top - 17} fontSize="12" fontWeight="700">{bar.barIndex + 1}</text>
                {isTarget && <rect ref={targetInputRef} x={start} y={top - 62} width={end - start} height="122" fill="transparent" pointerEvents="all" className="touch-none" style={{ touchAction: "none", WebkitUserSelect: "none", userSelect: "none", overscrollBehavior: "contain" }} onPointerMove={handleMove} onPointerLeave={() => { if (!draggingNote) setHoverNote(null); }} onPointerDown={handlePointerDown} onPointerUp={handlePointerUp} onPointerCancel={() => { setDraggingNote(null); setHoverNote(null); }} />}
                {isTarget && <RhythmGuide bar={bar} positions={positions} top={top} activeNoteId={activeNoteId} timeSignature={question.timeSignature} clef={question.clef} />}
                {isTarget
                  ? <BarNotes bar={bar} notes={targetUserNotes} positions={positions} top={top} hidden feedback={feedback} timeSignature={question.timeSignature} clef={question.clef} />
                  : <BarNotes bar={bar} notes={bar.notes} positions={positions} top={top} activeNoteId={activeNoteId} timeSignature={question.timeSignature} clef={question.clef} />}
                {isTarget && hoverNote && !feedback && (
                  <>
                    {draggingNote && <Note note={{ ...hoverNote, id: `ghost-${hoverNote.id}` }} x={positions[hoverNote.noteIndex]} top={top} colour="#666" faint clef={question.clef} />}
                    <Note note={hoverNote} x={positions[hoverNote.noteIndex]} top={top} colour="#444" faint={!draggingNote} scale={draggingNote ? 1.6 : 1} clef={question.clef} />
                  </>
                )}
                {feedback && isTarget && <CorrectionLayer bar={bar} userNotes={userNotes} positions={positions} top={top} timeSignature={question.timeSignature} clef={question.clef} />}
                {bar.barIndex === question.bars.length - 1 ? (
                  <g>
                    <line x1={end - 5} x2={end - 5} y1={top - 0.5} y2={top + STAFF.gap * 4 + 0.5} stroke="currentColor" strokeWidth="1.4" />
                    <line x1={end} x2={end} y1={top - 0.5} y2={top + STAFF.gap * 4 + 0.5} stroke="currentColor" strokeWidth="4" />
                  </g>
                ) : (
                  <line x1={end} x2={end} y1={top} y2={top + STAFF.gap * 4} stroke="currentColor" strokeWidth="1.35" />
                )}
              </g>
            );
          })}
          </g>
        </svg>
      );
    }

    function useStyles() {
      useEffect(() => {
        if (document.getElementById("missing-notes-shared-style")) return;
        const style = document.createElement("style");
        style.id = "missing-notes-shared-style";
        style.textContent = `
          @font-face { font-family: "Bravura"; src: url("./Bravura.otf") format("opentype"); font-display: block; }
          .music-symbol { font-family: "Bravura", serif; font-weight: 400; dominant-baseline: alphabetic; text-rendering: geometricPrecision; }
          button { -webkit-tap-highlight-color: transparent; user-select: none; transition: transform .08s ease, filter .08s ease, background-color .12s ease, box-shadow .12s ease; cursor: pointer; }
          button:active { transform: scale(.96); filter: brightness(.92); }

          @media (hover: hover) and (pointer: fine) {

        `;

      }, []);
    }

    function MenuSvgGlyph({ src, alt = "" }) {
      return <img src={src} alt={alt} className="h-[20px] w-[20px] object-contain" />;
    }

    function TempoDropdownRow({ tempo, setTempo, stopAudio }) {
      const selectedTempo = TEMPOS.find((speed) => speed.id === tempo) || TEMPOS[1];
      const cycleTempo = () => {
        const order = ["medium", "fast", "slow"];
        const currentIndex = order.indexOf(selectedTempo.id);
        setTempo(order[(currentIndex + 1) % order.length]);
        stopAudio();
      };
      return (
        <div className="hub-toggle-row relative min-h-[44px] overflow-visible">
          <span className="hub-toggle-label min-w-[145px]">

            </span>
            <span className="leading-none">Tempo</span>
          </span>
          <button
            type="button"
            onClick={cycleTempo}
            className="flex h-7 w-[86px] items-center justify-center rounded-xl border border-stone-300 bg-white px-2.5 text-sm font-bold text-stone-950 shadow-sm"
          >
            <span>{selectedTempo.label}</span>

    function CustomiseMenu({ tempo, setTempo, metronomeOn, setMetronomeOn, followPlayback, setFollowPlayback, stopAudio }) {
      return (
        <div className="flex w-full min-w-0 flex-col sm:inline-flex sm:w-max sm:min-w-[310px]">
          <window.MLH.MenuSubheading>Audio</window.MLH.MenuSubheading>
          <TempoDropdownRow tempo={tempo} setTempo={setTempo} stopAudio={stopAudio} />
          <window.MLH.MenuToggleRow glyph={<MenuSvgGlyph src={ASSET.metronome} alt="" />} label="Metronome" checked={metronomeOn} onChange={() => { setMetronomeOn((value) => !value); stopAudio(); }} />
          <window.MLH.MenuToggleRow glyph={<MenuSvgGlyph src={ASSET.eye} alt="" />} label="Follow Playback" checked={followPlayback} onChange={() => setFollowPlayback((value) => !value)} />
        </div>
      );
    }

    function Feedback({ feedback, fading }) {
      return <window.MLH.FeedbackBadge feedback={feedback} fading={fading} />;
    }

    function playSound(correct, celebration = false, medal = null) {
      window.MLH?.playFeedbackSound?.(correct, celebration, medal);
    }

    function missingNotesMedalSoundForStreak(streak) {
      if (streak === 10) return "platinum";
      if (streak === 6) return "gold";
      if (streak === 4) return "silver";
      if (streak === 2) return "bronze";
      return null;
    }

    function App() {
      useStyles();
      const initialLevel = useMemo(() => {
        const requested = new URLSearchParams(window.location.search).get("level");
        return LEVELS[requested] ? requested : "N5";
      }, []);
      const [activeLevel, setActiveLevel] = useState(initialLevel);
      const [tempo, setTempo] = useState("medium");
      const [metronomeOn, setMetronomeOn] = useState(false);
      const [followPlayback, setFollowPlayback] = useState(false);
      const [question, setQuestion] = useState(() => makeQuestion(initialLevel));
      const [userNotes, setUserNotes] = useState({});
      const [hoverNote, setHoverNote] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [feedbackFading, setFeedbackFading] = useState(false);
      const [visible, setVisible] = useState(true);
      const [score, setScore] = useState({ correct: 0, attempted: 0, streak: 0, best: 0 });
      const [confetti, setConfetti] = useState(0);
      const [menu, setMenu] = useState(null);
      const [prompt, setPrompt] = useState("");
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackElapsed, setPlaybackElapsed] = useState(0);
      const [activeNoteId, setActiveNoteId] = useState(null);
      const audioRef = useRef(null);
      const timersRef = useRef([]);
      const nextTimer = useRef(null);
      const fadeTimer = useRef(null);
      const menuRef = useRef(null);
      useEffect(() => {
        const closeMenuOnOutsidePointer = (event) => {
          if (event.target.closest?.("[data-menu-panel],[data-menu-trigger]")) return;
          if (!menuRef.current?.contains(event.target)) setMenu(null);
        };
        document.addEventListener("pointerdown", closeMenuOnOutsidePointer, true);
        return () => document.removeEventListener("pointerdown", closeMenuOnOutsidePointer, true);
      }, []);

      const selectedTempoId = activeLevel === "AH" ? "slow" : tempo;
      const selectedTempo = TEMPOS.find((item) => item.id === selectedTempoId) ?? TEMPOS[0];
      const beatSeconds = 60 / selectedTempo.bpm;
      const barSeconds = beatSeconds * question.timeSignature.beats;
      const totalDuration = question.bars.length * barSeconds;
      const accuracy = score.attempted === 0 ? 0 : Math.round((score.correct / score.attempted) * 100);

      function clearTimers() {
        timersRef.current.forEach((timer) => window.clearTimeout(timer));
        timersRef.current = [];
        window.clearTimeout(nextTimer.current);
        window.clearTimeout(fadeTimer.current);
      }

      function clearFeedbackTimers() {
        window.clearTimeout(nextTimer.current);
        window.clearTimeout(fadeTimer.current);
      }

      function stopAudio(resetElapsed = true) {
        clearTimers();
        if (audioRef.current) {
          try { audioRef.current.close(); } catch {}
        }
        audioRef.current = null;
        setIsPlaying(false);
        if (resetElapsed) setPlaybackElapsed(0);
        setActiveNoteId(null);
      }

      function newQuestion(level = activeLevel) {
        stopAudio();
        setVisible(false);
        window.setTimeout(() => {
          setQuestion(makeQuestion(level));
          setUserNotes({});
          setHoverNote(null);
          setFeedback(null);
          setFeedbackFading(false);
          setPrompt("");
          setVisible(true);
        }, 220);
      }

      function advanceAfterFeedback() {
        if (!feedback) return;
        clearFeedbackTimers();
        setFeedbackFading(true);
        nextTimer.current = window.setTimeout(() => newQuestion(), 180);
      }

      function applyLevel(level) {
        setMenu(null);
        if (level === activeLevel) return;
        setActiveLevel(level);
        setScore({ correct: 0, attempted: 0, streak: 0, best: 0 });
        setConfetti(0);
        const url = new URL(window.location.href);
        url.searchParams.set("level", level);
        window.history.replaceState(null, "", url.toString());
        newQuestion(level);
      }

      function resetScore() {
        setScore({ correct: 0, attempted: 0, streak: 0, best: 0 });
        setConfetti(0);
        newQuestion();
      }

      function clearUserNotes() {
        if (feedback) return;
        if (question.questionType === "identifyMelody") {
          setQuestion((current) => ({ ...current, selectedOptionIndex: null }));
          setPrompt("");
          return;
        }
        setUserNotes({});
      }

      function confirmAnswer() {
        if (feedback) return;
        if (question.questionType === "identifyMelody") {
          if (question.selectedOptionIndex === null) {
            setPrompt("Select one melody first.");
            return;
          }
          stopAudio();
          const correct = question.selectedOptionIndex === question.answerIndex;
          setScore((current) => {
            const streak = correct ? current.streak + 1 : 0;
            if (correct && [2, 4, 6, 10].includes(streak)) {
              const medalSound = missingNotesMedalSoundForStreak(streak);
              setConfetti((value) => value + 1);
              window.setTimeout(() => playSound(true, true, medalSound), 180);
            }
            return {
              correct: current.correct + (correct ? 1 : 0),
              attempted: current.attempted + 1,
              streak,
              best: Math.max(current.best, streak),
            };
          });
          playSound(correct);
          setFeedback({ correct });
          setFeedbackFading(false);
          setPrompt("");
          if (correct) {
            fadeTimer.current = window.setTimeout(() => setFeedbackFading(true), 1700);
            nextTimer.current = window.setTimeout(() => newQuestion(), 2050);
          }
          return;
        }
        const target = question.bars[question.targetBar];
        if (target.notes.some((_, index) => !userNotes[index])) {
          return;
        }
        stopAudio();
        const correct = target.notes.every((note, index) => userNotes[index]?.step === note.step);
        setScore((current) => {
          const streak = correct ? current.streak + 1 : 0;
          if (correct && [2, 4, 6, 10].includes(streak)) {
            const medalSound = missingNotesMedalSoundForStreak(streak);
            setConfetti((value) => value + 1);
            window.setTimeout(() => playSound(true, true, medalSound), 180);
          }
          return {
            correct: current.correct + (correct ? 1 : 0),
            attempted: current.attempted + 1,
            streak,
            best: Math.max(current.best, streak),
          };
        });
        playSound(correct);
        setFeedback({ correct });
        setFeedbackFading(false);
        setPrompt("");
        if (correct) {
          fadeTimer.current = window.setTimeout(() => setFeedbackFading(true), 1700);
          nextTimer.current = window.setTimeout(() => newQuestion(), 2050);
        }
      }

      function selectMelodyOption(index) {
        if (feedback) return;
        setQuestion((current) => current.questionType === "identifyMelody" ? { ...current, selectedOptionIndex: index } : current);
        setPrompt("");
      }

      function oscillator(ctx, gainNode, frequency, start, duration, volume = 0.035, type = "sine", release = 0.08) {
        window.MLH?.playPianoFrequency?.(ctx, gainNode, frequency, start, duration, volume);
      }

      function playMetronome(ctx, gainNode, start, accented) {
        window.MLH?.playMetronomeClick?.(ctx, gainNode, start, accented);
      }

      function playAccompaniment(ctx, gainNode, question, bar, barStart, offset, startTime) {
        if (barStart + barSeconds <= offset) return;
        const chordLetters = question.key.chords[bar.chordSymbol] ?? [];
        if (!chordLetters.length) return;

        if (bar.barIndex === question.bars.length - 1 && question.questionType === "identifyMelody" && question.bars.length === 2) {
          const finalNote = [...bar.notes].reverse().find((note) => !note.rest);
          if (!finalNote) return;
          const chordStart = barStart + finalNote.beat * beatSeconds;
          const chordDuration = Math.max(0.04, Math.min(finalNote.beats * beatSeconds * 0.72, beatSeconds * 0.72));
          if (chordStart + chordDuration <= offset) return;
          const audibleStart = Math.max(chordStart, offset);
          const audibleDuration = Math.max(0.04, chordStart + chordDuration - audibleStart);
          chordLetters.forEach((letter, index) => {
            const chordMidi = pitchForChordLetter(question, bar, letter, 3 + index);
            oscillator(ctx, gainNode, midiToFrequency(chordMidi), startTime + audibleStart, audibleDuration, 0.026, "triangle", 0.08);
            if (index === 0) oscillator(ctx, gainNode, midiToFrequency(chordMidi - 12), startTime + audibleStart, audibleDuration, 0.02, "sine", 0.08);
          });
          return;
        }

        if (bar.barIndex === question.bars.length - 1) {
          const chordStart = Math.max(barStart, offset);
          const chordDuration = Math.max(0.04, barStart + barSeconds * 0.96 - chordStart);
          chordLetters.forEach((letter, index) => {
            const chordMidi = pitchForChordLetter(question, bar, letter, 3 + index);
            oscillator(ctx, gainNode, midiToFrequency(chordMidi), startTime + chordStart, chordDuration, 0.026, "triangle", 0.08);
            if (index === 0) oscillator(ctx, gainNode, midiToFrequency(chordMidi - 12), startTime + chordStart, chordDuration, 0.02, "sine", 0.08);
          });
          return;
        }

        const bassMidi = pitchForChordLetter(question, bar, chordLetters[0], 2) - 12;
        const bassStart = Math.max(barStart, offset);
        const bassDuration = Math.max(0.04, barStart + beatSeconds * 0.88 - bassStart);
        oscillator(ctx, gainNode, midiToFrequency(bassMidi), startTime + bassStart, bassDuration, 0.024, "sine", 0.06);

        if (question.timeSignature.id === "4/4") {
          const events = [
            { beat: 1, type: "chord" },
            { beat: 2, type: "bass5" },
            { beat: 3, type: "chord" },
          ];
          events.forEach((event) => {
            const pulseStart = barStart + event.beat * beatSeconds;
            const pulseDuration = beatSeconds * 0.42;
            if (pulseStart + pulseDuration <= offset) return;
            const audibleStart = Math.max(pulseStart, offset);
            const audibleDuration = Math.max(0.04, pulseStart + pulseDuration - audibleStart);
            if (event.type === "bass5") {
              const fifthMidi = pitchForChordLetter(question, bar, chordLetters[1] ?? chordLetters[0], 2) - 12;
              oscillator(ctx, gainNode, midiToFrequency(fifthMidi), startTime + audibleStart, audibleDuration, 0.024, "sine", 0.06);
              return;
            }
            chordLetters.forEach((letter, index) => {
              const chordMidi = pitchForChordLetter(question, bar, letter, 3 + index);
              oscillator(ctx, gainNode, midiToFrequency(chordMidi), startTime + audibleStart, audibleDuration, 0.018, "triangle", 0.05);
            });
          });
          return;
        }

        const pulseBeats = question.timeSignature.id === "6/8"
          ? [1.5]
          : Array.from({ length: Math.max(0, question.timeSignature.beats - 1) }, (_, beat) => beat + 1);
        pulseBeats.forEach((beat) => {
          const pulseStart = barStart + beat * beatSeconds;
          const pulseDuration = beatSeconds * (question.timeSignature.id === "6/8" ? 0.72 : 0.42);
          if (pulseStart + pulseDuration <= offset) return;
          const audibleStart = Math.max(pulseStart, offset);
          const audibleDuration = Math.max(0.04, pulseStart + pulseDuration - audibleStart);
          chordLetters.forEach((letter, index) => {
            const chordMidi = pitchForChordLetter(question, bar, letter, 3 + index);
            oscillator(ctx, gainNode, midiToFrequency(chordMidi), startTime + audibleStart, audibleDuration, 0.018, "triangle", 0.05);
          });
        });
      }

      function playMelodyNote(ctx, gainNode, frequency, start, duration) {
        oscillator(ctx, gainNode, frequency, start, duration, 0.078);
      }

      async function playQuestionAudio(startAt = 0, restart = false) {
        if ((isPlaying || audioRef.current) && !restart) {
          stopAudio();
          return;
        }
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          setPrompt("Audio playback is not supported in this browser.");
          return;
        }
        const offset = clamp(Number(startAt) || 0, 0, totalDuration);
        stopAudio(false);
        if (offset >= totalDuration) {
          setPlaybackElapsed(totalDuration);
          return;
        }
        const ctx = new AudioContextClass();
        const master = ctx.createGain();
        master.gain.setValueAtTime(1.25, ctx.currentTime);
        master.connect(ctx.destination);
        audioRef.current = ctx;
        setIsPlaying(true);
        setPrompt("");
        setPlaybackElapsed(offset);
        const frequencies = question.bars.flatMap(bar => {
          const letters = question.key.chords[bar.chordSymbol] ?? [];
          const chord = letters.map((letter, index) => pitchForChordLetter(question, bar, letter, 3 + index));
          const bass = letters.length ? [
            chord[0] - 12,
            pitchForChordLetter(question, bar, letters[0], 2) - 12,
            pitchForChordLetter(question, bar, letters[1] ?? letters[0], 2) - 12,
          ] : [];
          return [
            ...bar.notes.filter(note => !note.rest).map(note => effectiveMidiForNote(question, bar, note)),
            ...chord, ...bass,
          ].map(midiToFrequency);
        });
        const ready = await window.MLH.prepareAudioPlayback(ctx, { piano: frequencies, metronome: metronomeOn });
        if (audioRef.current !== ctx) return;
        if (!ready) { stopAudio(); return; }
        const startTime = ctx.currentTime + 0.12 - offset;

        question.bars.forEach((bar) => {
          const barStart = bar.barIndex * barSeconds;
          if (metronomeOn) {
            window.MLH.metronomePulseOffsets(question.timeSignature).forEach((beat) => {
              const beatStart = barStart + beat * beatSeconds;
              if (beatStart >= offset) playMetronome(ctx, master, startTime + beatStart, beat === 0);
            });
          }
          playAccompaniment(ctx, master, question, bar, barStart, offset, startTime);
          bar.notes.forEach((note, noteIndex) => {
            if (note.rest || note.tiedFromPrevious) return;
            const noteStart = barStart + note.beat * beatSeconds;
            const nextTiedNote = note.tieToNext && !bar.notes[noteIndex + 1]?.rest ? bar.notes[noteIndex + 1] : null;
            const duration = (note.beats + (nextTiedNote?.beats ?? 0)) * beatSeconds * 0.96;
            if (noteStart + duration <= offset) return;
            const audibleStart = Math.max(noteStart, offset);
            const audibleDuration = Math.max(0.04, noteStart + duration - audibleStart);
            playMelodyNote(ctx, master, midiToFrequency(effectiveMidiForNote(question, bar, note)), startTime + audibleStart, audibleDuration);
            const highlightTimer = window.setTimeout(() => {
              if (followPlayback) setActiveNoteId(note.id);
            }, Math.max(0, (startTime + audibleStart - ctx.currentTime) * 1000));
            const clearTimer = window.setTimeout(() => setActiveNoteId(null), Math.max(0, (startTime + audibleStart - ctx.currentTime + audibleDuration) * 1000));
            timersRef.current.push(highlightTimer, clearTimer);
          });
        });

        const tick = window.setInterval(() => {
          if (!audioRef.current) return;
          const elapsed = Math.min(totalDuration, Math.max(0, ctx.currentTime - startTime));
          setPlaybackElapsed(elapsed);
        }, 100);
        const stopTimer = window.setTimeout(() => {
          window.clearInterval(tick);
          stopAudio();
        }, Math.max(0, (totalDuration - offset) * 1000) + 260);
        timersRef.current.push(tick, stopTimer);
      }

      useEffect(() => () => stopAudio(), []);

      const isIdentifyMelody = question.questionType === "identifyMelody";
      const targetBar = isIdentifyMelody ? null : question.bars[question.targetBar];
      const allRequiredNotesPlaced = isIdentifyMelody
        ? question.selectedOptionIndex !== null
        : Boolean(targetBar?.notes?.length) && targetBar.notes.every((_, index) => Boolean(userNotes[index]));
      const clearDisabled = Boolean(feedback) || (isIdentifyMelody ? question.selectedOptionIndex === null : !Object.keys(userNotes).length);

      return (
        <div className="overflow-x-hidden bg-stone-50 pb-10 text-black md:pb-12">
          <window.MLH.AppHeader icon={ASSET.appIcon} title="Melodic Dictation" subtitle="Identify and complete melodic patterns." worksheetConfig={activeLevel==="N3"||activeLevel==="N4" ? () => ({ version: 1, activityId: "missingnotes", sourceUrl: window.location.href, settings: { level: activeLevel } }) : null}>
            <window.MLH.ScoreStreakPanel achievementLevel={activeLevel} assets={ASSET} correct={score.correct} attempted={score.attempted} accuracy={accuracy} streak={score.streak} bestStreak={score.best} resetScore={resetScore} confettiKey={confetti} medalEligible={true} medalThresholdValues={[2, 4, 6, 10]} />
          </window.MLH.AppHeader>

          <div className="mx-auto max-w-6xl px-3 pt-[154px] sm:px-4 sm:pt-[154px] md:px-8 md:pt-[104px]">
            <main
              className="relative flex min-h-[560px] flex-col overflow-visible rounded-2xl border border-stone-200 bg-white px-3 pb-3 pt-[10px] shadow-sm sm:px-4 md:px-6 md:pb-6 md:pt-[14px]"
              onPointerDown={(event) => {
                if (!feedback) return;
                const button = event.target.closest("button");
                if (button && !button.closest("[data-feedback-continue]")) return;
                if (event.target.closest("[data-menu-trigger],[data-menu-panel]")) return;
                advanceAfterFeedback();
              }}
            >
              <div className="relative z-[90] mb-2.5 grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-2">
                <div className="relative flex items-center gap-2" ref={menuRef}>
                  <div className="hub-menu-anchor relative">
                    <window.MLH.LevelButton
                      icon={<img src={ASSET.level} alt="" aria-hidden="true" className="h-[26px] w-[28px] object-contain" />}
                      activeLevel={activeLevel}
                      activeLabel={LEVELS[activeLevel].label}
                      onClick={() => setMenu(menu === "level" ? null : "level")}
                      dataMenuTrigger
                    />
                    {menu === "level" && (
                      <window.MLH.MenuPanel title="Level" position="left-0" dataMenuPanel>
                        <window.MLH.LevelMenu activeLevel={activeLevel} onSelect={applyLevel} levels={LEVELS} />
                      </window.MLH.MenuPanel>
                    )}
                  </div>
                  <div className="hub-menu-anchor relative">
                    <window.MLH.CustomiseButton
                      icon={<img src={ASSET.customise} alt="" className="h-[21px] w-[21px]" />}
                      onClick={() => setMenu(menu === "customise" ? null : "customise")}
                      dataMenuTrigger
                    />
                  {menu === "customise" && (
                    <window.MLH.MenuPanel title="Customise" position="-left-[66px] sm:left-0" variant="customise" dataMenuPanel>
                      <CustomiseMenu
                        tempo={tempo}
                        setTempo={setTempo}
                        metronomeOn={metronomeOn}
                        setMetronomeOn={setMetronomeOn}
                        followPlayback={followPlayback}
                        setFollowPlayback={setFollowPlayback}
                        stopAudio={stopAudio}
                      />
                    </window.MLH.MenuPanel>
                  )}
                  </div>
                </div>
                <div className="flex h-10 min-w-[112px] items-center justify-center sm:min-w-[140px]">
                  <Feedback feedback={feedback} fading={feedbackFading} />
                </div>
                <div className="flex justify-end">
                  <window.MLH.SkipButton resetStreak={() => setScore((current) => ({ ...current, streak: 0 }))} onClick={() => newQuestion()} icon={<img src={ASSET.next} alt="" className="h-[27.8px] w-[27.8px] object-contain" />} />
                </div>
              </div>

              <div className={`mx-auto flex w-full flex-1 items-center justify-center transition-opacity duration-300 ${visible ? "opacity-100" : "opacity-0"}`}>
                <Score question={question} userNotes={userNotes} setUserNotes={setUserNotes} feedback={feedback} activeNoteId={activeNoteId} hoverNote={hoverNote} setHoverNote={setHoverNote} onSelectOption={selectMelodyOption} />
              </div>

              <section className={`relative z-10 rounded-xl border border-stone-200 bg-stone-50 p-3 shadow-md md:mx-3 ${isIdentifyMelody ? "mt-4" : "mt-auto md:-mt-[42px]"}`}>
                <p className="text-base font-semibold leading-tight">
                  {isIdentifyMelody
                    ? question.prompt
                    : question.useShortPrompt
                      ? <>Listen to the music and insert the missing notes in <strong>bar {question.targetBar + 1}</strong>.</>
                      : <>Listen to the music and insert the missing notes in <strong>bar {question.targetBar + 1}</strong>. The rhythm is given above the stave.</>}
                </p>
                {prompt && <p className="mt-2 text-sm font-medium text-red-700">{prompt}</p>}
                <div className={window.MLH.PlayClearConfirmRowClass}>
                  <button type="button" onClick={playQuestionAudio} className={window.MLH.PlayButtonClass}>
                    <span className="text-lg leading-none">{isPlaying ? "■" : "▶"}</span>
                    <span>{isPlaying ? "Stop" : "Play"}</span>
                  </button>
                  <div className={window.MLH.ActionButtonGroupClass}>
                    <button type="button" disabled={clearDisabled} onClick={clearUserNotes} className={window.MLH.ClearButtonClass}>
                      Clear
                    </button>
                    <window.MLH.ConfirmButton disabled={Boolean(feedback) || !allRequiredNotesPlaced} onClick={confirmAnswer} className={window.MLH.AudioConfirmButtonClass}>
                      Confirm
                    </window.MLH.ConfirmButton>
                  </div>
                </div>
              </section>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script src="./footer.js?v=20261005-update-history"></script>
</body>
</html>
