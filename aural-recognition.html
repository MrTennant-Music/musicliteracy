function initialSelection() {

  const requestedLevel = params.get("level") || saved.level || "N5";
  const level = typeof requestedLevel === "string" && Object.prototype.hasOwnProperty.call(LEVELS, requestedLevel) ? requestedLevel : "N5";

  const validTopic = typeof requestedTopic === "string" && Object.prototype.hasOwnProperty.call(TOPICS, requestedTopic) && !TOPICS[requestedTopic].placeholder ? requestedTopic : "cadence";

  return { level: levelForTopic(level, topic), topic };

  if (level === "N4") return [...national4, "simple", "compound", ...beatCounts, ...tempoChanges, ...scales];

  const higher = [...national5, "modal", "plagal", "interrupted", "add6", "dom7", "dim7"];

    const concepts = subtitleConceptIdsForLevel(level, topic);
    const newConcepts = concepts.filter(id => !introducedConcepts.has(id));
    concepts.forEach(id => introducedConcepts.add(id));

          ...question.notes[0].stack.flatMap(tone => [tone.midi, tone.midi + 12]),
          ...question.chordType.intervals.map(interval => question.rootMidi + interval),
        ].map(midiToFrequency)
      : isTimeListening
      ? melodyPianoFrequencies(question)
      : playbackLayers.flatMap(layer => melodyPianoFrequencies(layer, chordRegister, bassRegister));
    const ready = await window.MLH.prepareAudioPlayback(ctx, { piano: frequencies, metronome: metronome && questionTopic !== "ornaments" });
    if (audioRef.current !== ctx) return;
    if (!ready) { stopAudio(); return; }
    const beat = (60 / tempo.bpm) / (isTimeListening ? question.timeSignature.pulseQuarterBeats : 1);
    const start = ctx.currentTime + 0.12;
    if (passage) {
      passage.bars.forEach(bar => playAccompaniment(ctx, master, bar, bar.barIndex * passage.timeSignature.beats * beat, beat, start, passage));
      playAudioOnlyNotes(ctx, master, start, beat, passage);
      return;
    }
    if (usesIsolatedNotes) {
      playAudioOnlyNotes(ctx, master, start, beat);
      return;
    }
    if (question.layers) {
      playPolytonality(ctx, master, start, beat);
      return;
    }
    if (questionTopic === "chord") {
      playChord(ctx, master, start, beat);
      return;
    }
    if (questionTopic === "tempoChanges") {
      playTempoChanges(ctx, master, start);
      return;
    }
    question.bars.forEach(bar => {
      const barStart = bar.barIndex * question.timeSignature.beats * beat;
      if (metronome) {
        const pulses = isTimeListening ? question.timeSignature.pulseCount : question.timeSignature.beats;
        const pulseBeats = isTimeListening ? question.timeSignature.pulseQuarterBeats : 1;
        for (let b = 0; b < pulses; b++) playClick(ctx, master, start + barStart + b * pulseBeats * beat, b === 0);
      }
      playAccompaniment(ctx, master, bar, barStart, beat, start);
      bar.notes.forEach(note => {
        if (note.rest) return;
        const noteStart = barStart + note.beat * beat;
        const duration = note.beats * beat * 0.96;
        playMelodyNote(ctx, master, midiToFrequency(effectiveMidiForNote(question, bar, note)), start + noteStart, duration);
      });
    });
    const duration = question.bars.length * question.timeSignature.beats * beat;
    timers.current.push(setTimeout(stopAudio, Math.max(0, (start + duration - ctx.currentTime) * 1000) + 250));
  }
  function answerButtonClass(id){ const base="min-h-12 rounded-xl border px-3 py-2 text-sm font-bold"; if(!feedback) return `${base} border-stone-300 bg-white text-black`; if(isCorrectChoice(id, question)) return `${base} border-green-600 bg-green-600 text-white`; if(id===selected) return `${base} border-red-600 bg-red-600 text-white`; return `${base} border-stone-300 bg-white text-stone-500 opacity-70`; }
  const acc=attempted?Math.round(correct/attempted*100):0;
  const disabledConfirm=!questionVisible || feedback || (question.mode==="choice" ? !selected : !typed.trim());
  return <div className={window.MLH.shell.pageShellClass}><window.MLH.AppHeader icon={ASSET.appIcon} title="Aural Recognition" subtitle="Test your ears on chords, scales, tonalities and more."><window.MLH.ScoreStreakPanel achievementLevel={activeLevel} assets={ASSET} correct={correct} attempted={attempted} accuracy={acc} streak={streak} bestStreak={best} resetScore={()=>{setCorrect(0);setAttempted(0);setStreak(0);setBest(0);setConfetti(0);}} confettiKey={confetti} autoShowMedals={autoShowMedals} medalEligible={medalEligible} medalThresholdValues={MEDAL_THRESHOLDS}/></window.MLH.AppHeader><div className={window.MLH.shell.pageContentClass}><main className={window.MLH.shell.mainShellClass} onPointerDown={e=>{if(questionVisible&&feedback&&!e.target.closest("button,input,[data-menu-trigger],[data-menu-panel]"))newQuestion();}}>
    <div className="hub-toolbar relative z-20">
      <div className="hub-toolbar-left">
        <div className="hub-menu-anchor relative" ref={levelRef}>
          <window.MLH.LevelButton icon={<img src={ASSET.level} alt="" className="h-[26px] w-[28px]"/>} activeLevel={displayedLevel} activeLabel={displayedLevelLabel} isCustom={!medalEligible} onClick={()=>{setTopicOpen(false);setCustomiseOpen(false);setLevelOpen(v=>!v);}} dataMenuTrigger={true}/>
          {levelOpen && <window.MLH.MenuPanel title="Level" position="left-0" dataMenuPanel={true} floating={true}>
            <window.MLH.LevelMenu activeLevel={activeLevel} onSelect={applyLevel} levels={levelsForTopic(activeTopic)}/>
          </window.MLH.MenuPanel>}
        </div>
        <div className="hub-menu-anchor relative" ref={topicRef}>
          <button type="button" className={`${window.MLH.ToolbarButtonClass} gap-2`} data-menu-trigger={true} aria-label={`Exercise: ${TOPICS[activeTopic].label}`} aria-expanded={topicOpen} aria-controls="recognition-exercise-menu" onClick={()=>{setLevelOpen(false);setCustomiseOpen(false);setTopicOpen(v=>!v);}}>
            <ExerciseIcon topic={activeTopic}/>
            <span>{TOPICS[activeTopic].label}</span>
          </button>
          {topicOpen && <window.MLH.MenuPanel title="Exercise" position="left-0" className="recognition-topic-panel" dataMenuPanel={true} floating={true}>
            <div id="recognition-exercise-menu" role="group" aria-label="Exercise" className="flex w-full min-w-0 flex-col gap-2">
              {Object.keys(TOPICS).map(topic => <button key={topic} type="button" disabled={Boolean(TOPICS[topic].placeholder)} aria-pressed={topic === activeTopic} onClick={()=>applyTopic(topic)} className={`w-full rounded-xl border px-4 py-2 text-left transition ${TOPICS[topic].placeholder ? "cursor-not-allowed border-stone-200 bg-stone-100 opacity-50" : topic === activeTopic ? "border-stone-400 bg-stone-100" : "border-stone-200 bg-stone-50 hover:bg-stone-100"}`}>
                <div className="flex min-h-[46px] min-w-0 items-center justify-between gap-3 text-stone-900">
                  <div className="flex min-h-[46px] min-w-[42px] items-center justify-center">
                    <span className="flex h-[46px] w-[46px] shrink-0 items-center justify-center rounded-2xl border border-stone-200 bg-white shadow-sm scale-[1.08]">
                      <ExerciseIcon topic={topic} menu={true}/>
                    </span>
                  </div>
                  <div className="flex min-h-[46px] min-w-0 flex-1 flex-col justify-center pr-2">
                    <div className="pb-[1px] text-[13px] font-black leading-[1.2] whitespace-normal">{TOPICS[topic].label}</div>
                    {TOPICS[topic].placeholder && <div className="mt-[2px] pb-[2px] text-[11px] leading-[1.25] text-stone-600">Coming soon</div>}
                  </div>
                  {topic === activeTopic && <img src="./tick.svg" alt="" aria-hidden="true" className="h-[22px] w-[22px] shrink-0 self-center object-contain"/>}
                </div>
              </button>)}
            </div>
          </window.MLH.MenuPanel>}
        </div>
        <div className="hub-menu-anchor relative" ref={customiseRef}>
          <window.MLH.CustomiseButton icon={<img src={ASSET.customise} alt="" className="h-[26px] w-[26px]"/>} onClick={()=>{setLevelOpen(false);setTopicOpen(false);setCustomiseOpen(v=>!v);}} dataMenuTrigger={true}/>
          {customiseOpen && <window.MLH.MenuPanel title="Customise" position="chords-customise-panel left-0" variant="customise" dataMenuPanel={true}>
            <RecognitionMenuRows level={activeLevel} topic={activeTopic} enabled={enabled} setEnabled={(ids)=>{setEnabled(ids);newQuestion(activeLevel,ids);}} tempo={tempo} setTempo={setTempo} metronome={metronome} setMetronome={setMetronome} ornamentPassage={ornamentPassage} setOrnamentPassage={setOrnamentPassage} scalesPassage={scalesPassage} setScalesPassage={setScalesPassage} chordPassage={chordPassage} setChordPassage={setChordPassage} stopAudio={stopAudio}/>
          </window.MLH.MenuPanel>}
        </div>
      </div>
      <div className="hub-toolbar-feedback"><window.MLH.FeedbackBadge feedback={feedback} fading={feedbackFading} animationPrefix="note"/></div>
      <div className="hub-toolbar-right"><window.MLH.SkipButton resetStreak={()=>setStreak(0)} onClick={()=>newQuestion()} icon={<img src={ASSET.next} alt="" className="h-[27.8px] w-[27.8px]"/>}/></div>
    </div>
    <div className={`recognition-question ${questionVisible ? "" : "is-changing"}`} aria-busy={!questionVisible}>
    <div className="chords-question-card relative z-10 mt-6 flex flex-col rounded-xl border border-stone-200 bg-stone-50 px-4 py-4 shadow-md mx-3"><div><p className="text-base font-semibold leading-tight">{promptForQuestion(question, ornamentPassage, scalesPassage, chordPassage)}</p>{prompt&&<p className="mt-2 text-sm font-bold text-red-600">{prompt}</p>}<div className="mt-2">{question.mode==="choice"?<div className="flex flex-col gap-3"><div className={`grid gap-2 ${question.options.length <= 2 ? "w-1/2 grid-cols-2" : question.options.length === 3 ? "w-full grid-cols-3" : question.options.length === 5 ? "w-full grid-cols-5" : question.options.length === 6 ? "w-full grid-cols-3" : "w-full grid-cols-4"}`}>{question.options.map(id=><button key={id} disabled={Boolean(feedback) || !questionVisible} onClick={()=>{setSelected(id);score(isCorrectChoice(id, question));}} className={answerButtonClass(id)}><AnswerOptionLabel id={id}/></button>)}</div><button type="button" onClick={play} disabled={Boolean(feedback) || !questionVisible} className={window.MLH.PlayButtonClass}><span>{playing?"■":"▶"}</span><span>{playing?"Stop":"Play"}</span></button></div>:<div className="flex flex-wrap items-center gap-3"><input value={typed} disabled={Boolean(feedback) || !questionVisible} onChange={e=>setTyped(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!disabledConfirm){e.preventDefault();confirm();}}} placeholder="Type your answer" className={window.MLH.typedAnswerClass(feedback?{correct:isCorrectText(typed,question)}:null,"w-1/2")}/>{feedback&&!feedback.correct&&<div className="text-base font-bold text-green-600">{answerLabelForQuestion(question)}</div>}</div>}</div></div>{question.mode==="text"&&<div className={window.MLH.PlayClearConfirmRowClass}><button type="button" onClick={play} disabled={Boolean(feedback) || !questionVisible} className={window.MLH.PlayButtonClass}><span>{playing?"■":"▶"}</span><span>{playing?"Stop":"Play"}</span></button><div className={window.MLH.ActionButtonGroupClass}><button type="button" disabled={Boolean(feedback) || !questionVisible || !typed.trim()} onClick={clearAnswer} className={window.MLH.ClearButtonClass}>Clear</button><window.MLH.ConfirmButton disabled={disabledConfirm} onClick={confirm} className={window.MLH.AudioConfirmButtonClass}>Confirm</window.MLH.ConfirmButton></div></div>}</div></div></main></div></div>;
}
const root=document.getElementById("root"); if(ReactDOM.createRoot) ReactDOM.createRoot(root).render(<App/>); else ReactDOM.render(<App/>,root);

</script>
